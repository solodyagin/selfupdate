name: Platform Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  platform_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.21.x'
          - 'stable'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bsdiff

      - name: Test
        run: go test ./...
